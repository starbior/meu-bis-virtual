<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Moldura Proporção de Celular (9:16 fixo mesmo no PC, sem "caixa dentro de caixa") -->
  <div class="phone-screen" id="phone-screen">

    <!-- ================= FUNDO DESLIZANTE (5 CÔMODOS MAXIMALISTAS SEM CONTORNO, ORGÂNICOS E RICOS) ================= -->
    <div class="rooms-carousel" id="rooms-track">

      <!-- 0. COZINHA -->
      <section class="room-scene scene-kitchen">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="kWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffedd5"/>
              <stop offset="65%" stop-color="#fed7aa"/>
              <stop offset="100%" stop-color="#fdba74"/>
            </linearGradient>
            <linearGradient id="kSunlight" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="kCounter" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff1f2"/>
              <stop offset="15%" stop-color="#ffe4e6"/>
              <stop offset="15.5%" stop-color="#f43f5e"/>
              <stop offset="22%" stop-color="#e11d48"/>
              <stop offset="22.5%" stop-color="#9f1239"/>
              <stop offset="100%" stop-color="#4c0519"/>
            </linearGradient>
            <pattern id="kTileSoft" width="54" height="54" patternUnits="userSpaceOnUse">
              <rect width="54" height="54" fill="#fff7ed"/>
              <rect x="2" y="2" width="50" height="50" rx="10" fill="#ffedd5"/>
              <circle cx="27" cy="27" r="6" fill="#fdba74" opacity="0.35"/>
            </pattern>
            <pattern id="kDamask" width="70" height="70" patternUnits="userSpaceOnUse">
              <circle cx="35" cy="35" r="26" fill="#fb923c" opacity="0.1"/>
              <circle cx="0" cy="0" r="18" fill="#f97316" opacity="0.08"/>
              <circle cx="70" cy="70" r="18" fill="#f97316" opacity="0.08"/>
            </pattern>
          </defs>

          <!-- Parede com textura suave de arabescos sem contorno -->
          <rect width="430" height="640" fill="url(#kWall)"/>
          <rect width="430" height="640" fill="url(#kDamask)"/>

          <!-- Azulejos suaves ao fundo -->
          <rect y="320" width="430" height="300" fill="url(#kTileSoft)" opacity="0.8"/>

          <!-- Janela ensolarada à esquerda com céu, nuvens e plantas pendentes -->
          <g transform="translate(-15, 95)">
            <rect x="0" y="0" width="165" height="230" rx="82" fill="#38bdf8"/>
            <circle cx="95" cy="65" r="38" fill="#fef08a" opacity="0.9"/>
            <circle cx="95" cy="65" r="58" fill="#fef08a" opacity="0.28"/>
            <ellipse cx="65" cy="145" rx="55" ry="24" fill="#ffffff" opacity="0.85"/>
            <ellipse cx="120" cy="160" rx="45" ry="20" fill="#ffffff" opacity="0.9"/>
            <path d="M0 190 Q80 165 165 195 L165 230 L0 230 Z" fill="#34d399"/>
            <!-- Folhagens orgânicas sem contorno caindo sobre a janela -->
            <ellipse cx="35" cy="12" rx="28" ry="16" transform="rotate(-20 35 12)" fill="#10b981"/>
            <ellipse cx="75" cy="8" rx="32" ry="15" transform="rotate(12 75 8)" fill="#059669"/>
            <ellipse cx="125" cy="18" rx="26" ry="14" transform="rotate(30 125 18)" fill="#34d399"/>
            <circle cx="145" cy="48" r="12" fill="#10b981"/>
            <circle cx="152" cy="75" r="10" fill="#34d399"/>
            <circle cx="148" cy="100" r="8" fill="#059669"/>
          </g>

          <!-- Prateleiras quentes cheias de potes translúcidos, frutas, livros de receita e luzes -->
          <g transform="translate(185, 115)">
            <!-- Prateleira superior -->
            <rect x="0" y="75" width="230" height="14" rx="7" fill="#d97706" opacity="0.85"/>
            <!-- Pote de vidro com biscoitos -->
            <rect x="18" y="18" width="44" height="57" rx="16" fill="#ffffff" opacity="0.65"/>
            <circle cx="34" cy="56" r="9" fill="#d97706"/>
            <circle cx="48" cy="52" r="8" fill="#b45309"/>
            <circle cx="38" cy="40" r="9" fill="#f59e0b"/>
            <rect x="24" y="10" width="32" height="10" rx="5" fill="#f43f5e"/>
            <!-- Pote de geleia roxa -->
            <rect x="76" y="28" width="38" height="47" rx="14" fill="#a855f7" opacity="0.85"/>
            <rect x="82" y="20" width="26" height="10" rx="5" fill="#fde047"/>
            <!-- Bule de chá fumegante -->
            <ellipse cx="155" cy="52" rx="28" ry="22" fill="#fb7185"/>
            <path d="M178 48 Q198 35 190 58" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/>
            <circle cx="155" cy="28" r="7" fill="#fda4af"/>
            <!-- Vapor suave -->
            <path d="M185 20 Q192 5 182 -8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

            <!-- Prateleira inferior -->
            <rect x="20" y="185" width="210" height="14" rx="7" fill="#d97706" opacity="0.85"/>
            <!-- Tigela de frutas -->
            <circle cx="65" cy="155" r="16" fill="#ef4444"/>
            <circle cx="88" cy="152" r="17" fill="#facc15"/>
            <circle cx="105" cy="158" r="14" fill="#a855f7"/>
            <path d="M40 160 C45 190, 125 190, 130 160 Z" fill="#38bdf8"/>
            <!-- Quadros e plantas -->
            <rect x="148" y="118" width="52" height="67" rx="12" fill="#fef08a"/>
            <circle cx="174" cy="150" r="16" fill="#fb7185"/>
          </g>

          <!-- Geladeira pastel suave com luzes e imãs sem contorno -->
          <g transform="translate(25, 345)">
            <rect x="0" y="0" width="145" height="270" rx="28" fill="#5eead4"/>
            <rect x="12" y="12" width="121" height="95" rx="20" fill="#99f6e4" opacity="0.6"/>
            <rect x="115" y="45" width="8" height="36" rx="4" fill="#ffffff"/>
            <rect x="115" y="135" width="8" height="52" rx="4" fill="#ffffff"/>
            <circle cx="45" cy="52" r="12" fill="#f43f5e" opacity="0.85"/>
            <rect x="35" y="145" width="48" height="42" rx="6" transform="rotate(-8 55 165)" fill="#fef08a"/>
          </g>

          <!-- Feixe de luz solar suave atravessando a cozinha -->
          <polygon points="0,90 180,90 430,580 0,580" fill="url(#kSunlight)"/>

          <!-- Varal de luzes quentes no topo -->
          <circle cx="55" cy="55" r="14" fill="#fef08a" opacity="0.45"/>
          <circle cx="55" cy="55" r="6" fill="#ffffff"/>
          <circle cx="145" cy="72" r="14" fill="#fef08a" opacity="0.45"/>
          <circle cx="145" cy="72" r="6" fill="#ffffff"/>
          <circle cx="245" cy="70" r="14" fill="#fef08a" opacity="0.45"/>
          <circle cx="245" cy="70" r="6" fill="#ffffff"/>
          <circle cx="345" cy="52" r="14" fill="#fef08a" opacity="0.45"/>
          <circle cx="345" cy="52" r="6" fill="#ffffff"/>

          <!-- Bancada / Mesa da Cozinha onde o Bis fica apoiado -->
          <path d="M-20 575 Q215 545 450 575 L450 900 L-20 900 Z" fill="url(#kCounter)"/>
          <!-- Toalha suave sob o Bis -->
          <ellipse cx="215" cy="605" rx="165" ry="36" fill="#ffffff" opacity="0.85"/>
          <ellipse cx="215" cy="605" rx="142" ry="28" fill="#fecdd3" opacity="0.65"/>
        </svg>
      </section>

      <!-- 1. BANHEIRO -->
      <section class="room-scene scene-bathroom">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="bWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#cffafe"/>
              <stop offset="55%" stop-color="#a5f3fc"/>
              <stop offset="100%" stop-color="#67e8f9"/>
            </linearGradient>
            <linearGradient id="bFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e0f2fe"/>
              <stop offset="20%" stop-color="#7dd3fc"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
            <pattern id="bMosaic" width="44" height="44" patternUnits="userSpaceOnUse">
              <rect width="20" height="20" rx="5" fill="#ffffff" opacity="0.35"/>
              <rect x="22" width="20" height="20" rx="5" fill="#22d3ee" opacity="0.2"/>
              <rect y="22" width="20" height="20" rx="5" fill="#f472b6" opacity="0.15"/>
              <rect x="22" y="22" width="20" height="20" rx="5" fill="#ffffff" opacity="0.45"/>
            </pattern>
          </defs>

          <rect width="430" height="640" fill="url(#bWall)"/>
          <rect width="430" height="640" fill="url(#bMosaic)"/>

          <!-- Bolhas gigantes translúcidas flutuando no fundo do banheiro -->
          <circle cx="65" cy="180" r="48" fill="#ffffff" opacity="0.28"/>
          <circle cx="365" cy="140" r="62" fill="#ffffff" opacity="0.22"/>
          <circle cx="330" cy="290" r="35" fill="#f472b6" opacity="0.18"/>
          <circle cx="95" cy="390" r="28" fill="#ffffff" opacity="0.35"/>

          <!-- Espelho Oval Iluminado com Plantas de Banheiro e Frascos Coloridos -->
          <g transform="translate(30, 115)">
            <ellipse cx="85" cy="115" rx="76" ry="102" fill="#fef08a" opacity="0.5"/>
            <ellipse cx="85" cy="115" rx="66" ry="92" fill="#e0f2fe"/>
            <path d="M45 65 L95 35 L115 45 L55 85 Z" fill="#ffffff" opacity="0.65"/>
            <!-- Samambaia pendente -->
            <circle cx="15" cy="35" r="20" fill="#34d399"/>
            <circle cx="5" cy="65" r="16" fill="#10b981"/>
            <circle cx="18" cy="92" r="14" fill="#6ee7b7"/>
            <circle cx="8" cy="118" r="11" fill="#34d399"/>
          </g>

          <!-- Prateleiras de Spa com Toalhas Felpudas, Velas, Patinhos e Shampoos -->
          <g transform="translate(225, 140)">
            <rect x="0" y="88" width="185" height="12" rx="6" fill="#ffffff" opacity="0.8"/>
            <!-- Toalhas enroladas -->
            <rect x="15" y="55" width="58" height="32" rx="16" fill="#f472b6"/>
            <rect x="22" y="30" width="46" height="26" rx="13" fill="#c084fc"/>
            <!-- Frascos de shampoo e poções de banho -->
            <rect x="92" y="34" width="28" height="54" rx="12" fill="#34d399"/>
            <rect x="128" y="44" width="32" height="44" rx="14" fill="#fbbf24"/>
            <!-- Patinho de borracha -->
            <circle cx="155" cy="175" r="20" fill="#fde047"/>
            <circle cx="168" cy="155" r="13" fill="#fde047"/>
            <ellipse cx="180" cy="156" rx="7" ry="4" fill="#fb923c"/>
            <rect x="15" y="192" width="170" height="12" rx="6" fill="#ffffff" opacity="0.8"/>
            <!-- Conchas e estrelas do mar -->
            <circle cx="55" cy="172" r="18" fill="#fb7185" opacity="0.85"/>
            <circle cx="98" cy="176" r="14" fill="#a855f7" opacity="0.75"/>
          </g>

          <!-- Ducha de Spa no Topo Central -->
          <rect x="208" y="0" width="14" height="72" fill="#cbd5e1"/>
          <ellipse cx="215" cy="76" rx="52" ry="14" fill="#e2e8f0"/>
          <ellipse cx="215" cy="80" rx="44" ry="8" fill="#94a3b8"/>

          <!-- Bancada / Banheira de Espuma sob o Bis -->
          <path d="M-20 575 Q215 545 450 575 L450 900 L-20 900 Z" fill="url(#bFloor)"/>
          <!-- Tapete de nuvem fofinho -->
          <ellipse cx="215" cy="605" rx="170" ry="38" fill="#ffffff" opacity="0.9"/>
          <ellipse cx="215" cy="605" rx="140" ry="28" fill="#bae6fd" opacity="0.7"/>
        </svg>
      </section>

      <!-- 2. SALA DE JOGOS / ARCADE -->
      <section class="room-scene scene-playroom">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="pWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2e1065"/>
              <stop offset="60%" stop-color="#4c1d95"/>
              <stop offset="100%" stop-color="#701a75"/>
            </linearGradient>
            <linearGradient id="pFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a21caf"/>
              <stop offset="25%" stop-color="#6b21a8"/>
              <stop offset="100%" stop-color="#2e1065"/>
            </linearGradient>
          </defs>

          <rect width="430" height="640" fill="url(#pWall)"/>

          <!-- Brilhos bokeh coloridos e formas flutuantes de festa/jogo -->
          <circle cx="70" cy="130" r="65" fill="#f43f5e" opacity="0.18"/>
          <circle cx="350" cy="180" r="85" fill="#38bdf8" opacity="0.16"/>
          <circle cx="210" cy="280" r="95" fill="#facc15" opacity="0.12"/>

          <!-- Bandeirinhas suaves no topo -->
          <polygon points="10,55 55,115 95,55" fill="#f43f5e" opacity="0.85"/>
          <polygon points="95,55 140,120 185,55" fill="#facc15" opacity="0.85"/>
          <polygon points="185,55 230,120 275,55" fill="#38bdf8" opacity="0.85"/>
          <polygon points="275,55 320,120 365,55" fill="#34d399" opacity="0.85"/>
          <polygon points="365,55 405,115 440,55" fill="#c084fc" opacity="0.85"/>

          <!-- Fliperama Iluminado Suave à Esquerda -->
          <g transform="translate(22, 195)">
            <rect x="0" y="0" width="135" height="340" rx="26" fill="#4f46e5"/>
            <rect x="14" y="18" width="107" height="32" rx="12" fill="#fde047"/>
            <rect x="18" y="65" width="99" height="88" rx="16" fill="#0f172a"/>
            <circle cx="67" cy="109" r="24" fill="#a855f7" opacity="0.9"/>
            <circle cx="48" cy="180" r="9" fill="#f43f5e"/>
            <circle cx="78" cy="184" r="7" fill="#34d399"/>
            <circle cx="98" cy="178" r="7" fill="#38bdf8"/>
          </g>

          <!-- Estante Geek com Lava Lamp, Discos de Vinil, Livros e Pelúcias à Direita -->
          <g transform="translate(230, 175)">
            <rect x="0" y="95" width="180" height="12" rx="6" fill="#c084fc" opacity="0.55"/>
            <!-- Lava lamp brilhante -->
            <path d="M28 95 L40 25 L62 25 L74 95 Z" fill="#fb7185"/>
            <circle cx="51" cy="68" r="11" fill="#fde047"/>
            <circle cx="51" cy="44" r="7" fill="#fde047"/>
            <!-- Vinil colorido -->
            <circle cx="130" cy="58" r="34" fill="#1e1b4b"/>
            <circle cx="130" cy="58" r="13" fill="#38bdf8"/>

            <rect x="15" y="215" width="165" height="12" rx="6" fill="#c084fc" opacity="0.55"/>
            <!-- Troféu e livros -->
            <path d="M35 155 L75 155 L65 205 L45 205 Z" fill="#facc15"/>
            <rect x="98" y="150" width="18" height="65" rx="5" fill="#34d399"/>
            <rect x="118" y="142" width="20" height="73" rx="5" fill="#38bdf8"/>
            <rect x="140" y="156" width="18" height="59" rx="5" fill="#f43f5e"/>
          </g>

          <!-- Palco / Tapete Redondo de Jogos sob o Bis -->
          <path d="M-20 575 Q215 545 450 575 L450 900 L-20 900 Z" fill="url(#pFloor)"/>
          <ellipse cx="215" cy="605" rx="172" ry="38" fill="#f472b6" opacity="0.45"/>
          <ellipse cx="215" cy="605" rx="138" ry="28" fill="#fde047" opacity="0.65"/>
        </svg>
      </section>

      <!-- 3. QUARTO -->
      <section class="room-scene scene-bedroom">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="nWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="55%" stop-color="#1e1b4b"/>
              <stop offset="100%" stop-color="#311042"/>
            </linearGradient>
            <linearGradient id="nFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4c1d95"/>
              <stop offset="30%" stop-color="#2e1065"/>
              <stop offset="100%" stop-color="#090514"/>
            </linearGradient>
          </defs>

          <rect width="430" height="640" fill="url(#nWall)"/>

          <!-- Constelações, nebulosa suave e estrelinhas sem contorno -->
          <circle cx="320" cy="190" r="110" fill="#8b5cf6" opacity="0.14"/>
          <circle cx="95" cy="240" r="90" fill="#38bdf8" opacity="0.12"/>
          <circle cx="55" cy="120" r="3" fill="#fef08a"/>
          <circle cx="140" cy="95" r="2.5" fill="#ffffff"/>
          <circle cx="365" cy="110" r="3.5" fill="#fef08a"/>
          <circle cx="295" cy="165" r="2.5" fill="#bae6fd"/>
          <circle cx="380" cy="275" r="3" fill="#fef08a"/>

          <!-- Janela Arqueada com Céu Estrelado e Lua Crescente Brilhante -->
          <g transform="translate(32, 130)">
            <rect x="0" y="0" width="155" height="235" rx="77" fill="#060913"/>
            <circle cx="78" cy="88" r="46" fill="#fef08a" opacity="0.2"/>
            <circle cx="75" cy="88" r="30" fill="#fef08a"/>
            <circle cx="88" cy="78" r="26" fill="#060913"/>
            <circle cx="42" cy="155" r="2.5" fill="#ffffff"/>
            <circle cx="115" cy="140" r="3" fill="#bae6fd"/>
            <path d="M0 195 Q80 170 155 200 L155 235 L0 235 Z" fill="#1e1b4b"/>
          </g>

          <!-- Prateleira com Pelúcias, Livros e Relógio à Direita -->
          <g transform="translate(235, 210)">
            <rect x="0" y="85" width="165" height="12" rx="6" fill="#a855f7" opacity="0.45"/>
            <!-- Gatinho de pelúcia dormindo -->
            <ellipse cx="62" cy="66" rx="34" ry="20" fill="#f472b6"/>
            <polygon points="36,54 44,35 56,52" fill="#f472b6"/>
            <polygon points="68,52 80,35 88,54" fill="#f472b6"/>
            <!-- Globo luminoso -->
            <circle cx="132" cy="56" r="24" fill="#38bdf8" opacity="0.8"/>
            <circle cx="132" cy="56" r="32" fill="#38bdf8" opacity="0.22"/>
          </g>

          <!-- Luminária Pendente Aconchegante no Centro -->
          <g id="room-lamp" class="clickable-lamp" transform="translate(215, 0)">
            <rect x="-2" y="0" width="4" height="75" fill="#94a3b8" opacity="0.6"/>
            <circle cx="0" cy="95" r="56" fill="#fef08a" opacity="0.22" id="lamp-aura"/>
            <path d="M-34 92 C-34 58, 34 58, 34 92 Z" fill="#fb7185"/>
            <circle cx="0" cy="94" r="12" fill="#fef08a"/>
          </g>

          <!-- Cama / Almofadão Real Macio onde o Bis Dorme -->
          <path d="M-20 575 Q215 545 450 575 L450 900 L-20 900 Z" fill="url(#nFloor)"/>
          <ellipse cx="215" cy="605" rx="178" ry="44" fill="#6366f1" opacity="0.75"/>
          <ellipse cx="215" cy="602" rx="148" ry="33" fill="#c084fc" opacity="0.8"/>
          <ellipse cx="215" cy="600" rx="115" ry="23" fill="#fef08a" opacity="0.75"/>
        </svg>
      </section>

      <!-- 4. CLOSET / CRIE SEU BIS -->
      <section class="room-scene scene-closet">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="cWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fdf2f8"/>
              <stop offset="55%" stop-color="#fce7f3"/>
              <stop offset="100%" stop-color="#f5d0fe"/>
            </linearGradient>
            <linearGradient id="cFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d946ef"/>
              <stop offset="25%" stop-color="#a21caf"/>
              <stop offset="100%" stop-color="#4a044e"/>
            </linearGradient>
            <pattern id="cStripes" width="56" height="56" patternUnits="userSpaceOnUse">
              <rect width="28" height="56" fill="#fbcfe8" opacity="0.35"/>
            </pattern>
          </defs>

          <rect width="430" height="640" fill="url(#cWall)"/>
          <rect width="430" height="640" fill="url(#cStripes)"/>

          <!-- Cortinas de Veludo Suaves nas Laterais -->
          <path d="M0 0 L115 0 C95 220, 65 410, 25 590 L0 590 Z" fill="#ec4899" opacity="0.75"/>
          <path d="M430 0 L315 0 C335 220, 365 410, 405 590 L430 590 Z" fill="#ec4899" opacity="0.75"/>

          <!-- Espelho de Camarim Iluminado ao Fundo Central -->
          <g transform="translate(105, 115)">
            <rect x="0" y="0" width="220" height="310" rx="110" fill="#facc15" opacity="0.65"/>
            <rect x="16" y="16" width="188" height="278" rx="94" fill="#e0f2fe"/>
            <!-- Luzinhas suaves de camarim sem contorno -->
            <circle cx="22" cy="85" r="8" fill="#ffffff"/>
            <circle cx="14" cy="155" r="8" fill="#ffffff"/>
            <circle cx="22" cy="225" r="8" fill="#ffffff"/>
            <circle cx="198" cy="85" r="8" fill="#ffffff"/>
            <circle cx="206" cy="155" r="8" fill="#ffffff"/>
            <circle cx="198" cy="225" r="8" fill="#ffffff"/>
          </g>

          <!-- Pódio Iluminado sob o Bis -->
          <path d="M-20 575 Q215 545 450 575 L450 900 L-20 900 Z" fill="url(#cFloor)"/>
          <ellipse cx="215" cy="605" rx="172" ry="40" fill="#fde047" opacity="0.75"/>
          <ellipse cx="215" cy="602" rx="145" ry="30" fill="#ffffff" opacity="0.85"/>
        </svg>
      </section>
    </div>

    <!-- Escuridão suave quando a luz do quarto está apagada -->
    <div class="night-overlay" id="night-overlay"></div>

    <!-- ================= HUD SUPERIOR DIRETO NA TELA (SEM CAIXA DENTRO DE CAIXA!) ================= -->
    <header class="pou-top-bar">
      <div class="top-stats-row">
        <!-- Moedas à esquerda -->
        <div class="floating-coins" title="Moedas">
          <span class="coin-orb">🪙</span>
          <span id="hud-coins">120</span>
        </div>

        <!-- 4 Status Flutuantes Estilo Pou (Sem caixas em volta) -->
        <div class="floating-meters">
          <div class="meter-orb" title="Fome">
            <span class="orb-emoji">🍙</span>
            <div class="orb-bar"><div class="orb-fill" id="hud-hunger"></div></div>

            <radialGradient id="bisBodyGrad" cx="36%" cy="28%" r="68%">

              <stop offset="100%" stop-color="#1e064a" />

              <!-- Tentáculo 3 -->

              <!-- Tentáculo 5 -->

                <path d="M 202 148 Q 218 134 234 148" stroke="#180446" stroke-width="5" stroke-linecap="round" fill="none" />

              <!-- Boca ao mastigar -->
