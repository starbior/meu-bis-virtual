<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bis! — Meu Polvo Roxo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-viewport" id="app-viewport">

    <!-- ================= HUD SUPERIOR ESTILO POU CLÁSSICO CARTOON ================= -->
    <header class="pou-header">
      <div class="status-cluster">
        <!-- Fome -->
        <div class="pou-stat" title="Fome">
          <div class="stat-badge badge-food">
            <svg viewBox="0 0 36 36"><path d="M8 22 C8 13, 28 13, 28 22 Z" fill="#f59e0b" stroke="#231138" stroke-width="3"/><rect x="6" y="21" width="24" height="5" rx="2.5" fill="#22c55e" stroke="#231138" stroke-width="2.5"/><path d="M9 25 L27 25 C27 30, 9 30, 9 25 Z" fill="#d97706" stroke="#231138" stroke-width="3"/></svg>
          </div>
          <div class="stat-meter"><div class="stat-fill" id="hud-hunger"></div></div>
        </div>

        <!-- Limpeza -->
        <div class="pou-stat" title="Banho / Limpeza">
          <div class="stat-badge badge-clean">
            <svg viewBox="0 0 36 36"><rect x="7" y="13" width="22" height="14" rx="7" fill="#f472b6" stroke="#231138" stroke-width="3"/><circle cx="13" cy="9" r="4" fill="#bae6fd" stroke="#231138" stroke-width="2.5"/><circle cx="22" cy="8" r="3" fill="#bae6fd" stroke="#231138" stroke-width="2.5"/></svg>
          </div>
          <div class="stat-meter"><div class="stat-fill" id="hud-clean"></div></div>
        </div>

        <!-- Diversão -->
        <div class="pou-stat" title="Diversão">
          <div class="stat-badge badge-fun">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="11" fill="#facc15" stroke="#231138" stroke-width="3"/><circle cx="14" cy="15" r="2" fill="#231138"/><circle cx="22" cy="15" r="2" fill="#231138"/><path d="M13 20 Q18 25 23 20" fill="none" stroke="#231138" stroke-width="2.8" stroke-linecap="round"/></svg>
          </div>
          <div class="stat-meter"><div class="stat-fill" id="hud-fun"></div></div>
        </div>

        <!-- Energia -->
        <div class="pou-stat" title="Energia">
          <div class="stat-badge badge-energy">
            <svg viewBox="0 0 36 36"><polygon points="20,5 9,20 18,20 15,31 27,16 18,16" fill="#38bdf8" stroke="#231138" stroke-width="3" stroke-linejoin="round"/></svg>
          </div>
          <div class="stat-meter"><div class="stat-fill" id="hud-energy"></div></div>
        </div>
      </div>

      <!-- Navegador de Salas Estilo Placa do Pou -->
      <div class="room-banner">
        <button class="chunky-arrow" id="btn-prev-room" aria-label="Sala anterior">◀</button>
        <div class="room-sign">
          <span class="room-title" id="room-title">COZINHA</span>
          <div class="room-dots" id="room-dots"></div>
        </div>
        <button class="chunky-arrow" id="btn-next-room" aria-label="Próxima sala">▶</button>
      </div>

      <!-- Moedas -->
      <div class="coin-counter" title="Moedas">
        <div class="coin-icon">$</div>
        <span id="hud-coins">120</span>
      </div>
    </header>

    <!-- ================= CENÁRIOS MAXIMALISTAS ILUSTRADOS (SCROLL HORIZONTAL) ================= -->
    <div class="rooms-track" id="rooms-track">

      <!-- ================= SALA 0: COZINHA MAXIMALISTA ================= -->
      <section class="room-slide" data-room="0">
        <svg class="room-bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <!-- Papel de parede listrado retrô quentinho -->
            <pattern id="kitchenWallpaper" width="60" height="60" patternUnits="userSpaceOnUse">
              <rect width="60" height="60" fill="#fff3d1"/>
              <rect x="0" width="30" height="60" fill="#ffe4a3"/>
              <circle cx="15" cy="15" r="3" fill="#f59e0b" opacity="0.35"/>
              <circle cx="45" cy="45" r="3" fill="#ef4444" opacity="0.35"/>
            </pattern>
            <!-- Azulejo colorido de cozinha -->
            <pattern id="kitchenBacksplash" width="48" height="48" patternUnits="userSpaceOnUse">
              <rect width="48" height="48" fill="#fef3c7" stroke="#231138" stroke-width="2"/>
              <polygon points="24,6 42,24 24,42 6,24" fill="#38bdf8" opacity="0.35"/>
            </pattern>
            <!-- Piso quadriculado clássico de lanchonete/cozinha -->
            <pattern id="checkerFloor" width="120" height="80" patternUnits="userSpaceOnUse">
              <rect width="60" height="40" fill="#231138"/>
              <rect x="60" width="60" height="40" fill="#fffbeb"/>
              <rect y="40" width="60" height="40" fill="#fffbeb"/>
              <rect x="60" y="40" width="60" height="40" fill="#231138"/>
            </pattern>
          </defs>

          <!-- Parede de fundo -->
          <rect width="1440" height="620" fill="url(#kitchenWallpaper)" />
          <!-- Faixa de azulejos -->
          <rect y="360" width="1440" height="260" fill="url(#kitchenBacksplash)" stroke="#231138" stroke-width="5"/>

          <!-- Janela Grande com Paisagem, Cortinas de Bolinhas e Vasos -->
          <g transform="translate(80, 70)">
            <rect x="0" y="0" width="290" height="260" rx="18" fill="#7dd3fc" stroke="#231138" stroke-width="6"/>
            <!-- Sol e nuvens lá fora -->
            <circle cx="70" cy="65" r="34" fill="#fde047" stroke="#231138" stroke-width="4"/>
            <path d="M130 95 C130 75, 165 75, 175 88 C190 72, 225 78, 225 98 C240 100, 240 120, 220 120 L130 120 C115 120, 115 100, 130 95 Z" fill="#ffffff" stroke="#231138" stroke-width="4"/>
            <!-- Colinas verdes -->
            <path d="M4 210 Q90 155 170 210 T286 200 L286 256 L4 256 Z" fill="#4ade80" stroke="#231138" stroke-width="4"/>
            <!-- Grade da janela -->
            <line x1="145" y1="0" x2="145" y2="260" stroke="#fff" stroke-width="8"/>
            <line x1="145" y1="0" x2="145" y2="260" stroke="#231138" stroke-width="4"/>
            <line x1="0" y1="135" x2="290" y2="135" stroke="#fff" stroke-width="8"/>
            <line x1="0" y1="135" x2="290" y2="135" stroke="#231138" stroke-width="4"/>
            <!-- Cortinas vermelhas -->
            <path d="M-10 -10 L65 -10 C55 90, 45 140, 10 250 L-10 250 Z" fill="#fb7185" stroke="#231138" stroke-width="5"/>
            <path d="M300 -10 L225 -10 C235 90, 245 140, 280 250 L300 250 Z" fill="#fb7185" stroke="#231138" stroke-width="5"/>
            <rect x="-20" y="-16" width="330" height="22" rx="10" fill="#9a3412" stroke="#231138" stroke-width="5"/>
            <!-- Peitoril com vasos de planta -->
            <rect x="-15" y="252" width="320" height="22" rx="6" fill="#fed7aa" stroke="#231138" stroke-width="5"/>
            <polygon points="85,252 95,215 130,215 140,252" fill="#ea580c" stroke="#231138" stroke-width="4"/>
            <circle cx="105" cy="202" r="16" fill="#22c55e" stroke="#231138" stroke-width="4"/>
            <circle cx="125" cy="200" r="14" fill="#16a34a" stroke="#231138" stroke-width="4"/>
            <circle cx="115" cy="190" r="10" fill="#fbbf24" stroke="#231138" stroke-width="3"/>
          </g>

          <!-- Geladeira Retrô Cheia de Ímãs, Stickers e Desenhos do Bis -->
          <g transform="translate(415, 130)">
            <rect x="0" y="0" width="235" height="490" rx="28" fill="#2dd4bf" stroke="#231138" stroke-width="6"/>
            <line x1="0" y1="175" x2="235" y2="175" stroke="#231138" stroke-width="6"/>
            <!-- Puxadores cromados -->
            <rect x="195" y="95" width="16" height="55" rx="8" fill="#f8fafc" stroke="#231138" stroke-width="4"/>
            <rect x="195" y="210" width="16" height="80" rx="8" fill="#f8fafc" stroke="#231138" stroke-width="4"/>
            <!-- Desenho colado na geladeira -->
            <rect x="35" y="45" width="95" height="85" transform="rotate(-6 80 80)" fill="#ffffff" stroke="#231138" stroke-width="4"/>
            <circle cx="82" cy="85" r="22" fill="#7c3aed" stroke="#231138" stroke-width="3"/>
            <circle cx="75" cy="82" r="6" fill="#fff"/><circle cx="89" cy="82" r="6" fill="#fff"/>
            <circle cx="38" cy="48" r="9" fill="#ef4444" stroke="#231138" stroke-width="3"/>
            <!-- Notas e ímãs -->
            <rect x="50" y="220" width="70" height="65" transform="rotate(8 85 250)" fill="#fde047" stroke="#231138" stroke-width="4"/>
            <circle cx="150" cy="240" r="14" fill="#f43f5e" stroke="#231138" stroke-width="4"/>
            <polygon points="150,310 165,340 135,340" fill="#a855f7" stroke="#231138" stroke-width="4"/>
            <!-- Cesta de frutas em cima da geladeira -->
            <path d="M55 0 C55 -40, 175 -40, 175 0 Z" fill="#f59e0b" stroke="#231138" stroke-width="5"/>
            <circle cx="95" cy="-28" r="16" fill="#ef4444" stroke="#231138" stroke-width="4"/>
            <circle cx="125" cy="-32" r="18" fill="#facc15" stroke="#231138" stroke-width="4"/>
            <circle cx="148" cy="-24" r="15" fill="#a855f7" stroke="#231138" stroke-width="4"/>
          </g>

          <!-- Barra de Panelas de Cobre e Utensílios Pendurados no Centro-Topo -->
          <g transform="translate(680, 55)">
            <rect x="0" y="0" width="320" height="12" rx="6" fill="#334155" stroke="#231138" stroke-width="4"/>
            <!-- Frigideira -->
            <line x1="60" y1="12" x2="60" y2="65" stroke="#231138" stroke-width="5"/>
            <circle cx="60" cy="95" r="36" fill="#ea580c" stroke="#231138" stroke-width="5"/>
            <circle cx="60" cy="95" r="24" fill="#fb923c" stroke="#231138" stroke-width="3"/>
            <!-- Concha e Espátula -->
            <line x1="145" y1="12" x2="145" y2="95" stroke="#231138" stroke-width="5"/>
            <rect x="130" y="95" width="30" height="26" rx="4" fill="#94a3b8" stroke="#231138" stroke-width="4"/>
            <!-- Panela de Cobre -->
            <line x1="235" y1="12" x2="235" y2="55" stroke="#231138" stroke-width="5"/>
            <rect x="195" y="55" width="80" height="58" rx="12" fill="#f97316" stroke="#231138" stroke-width="5"/>
          </g>

          <!-- Prateleiras de Madeira, Potes de Biscoito, Temperos, Relógio e Plantas à Direita -->
          <g transform="translate(1030, 80)">
            <!-- Relógio de parede de Gato/Polvo -->
            <circle cx="70" cy="45" r="46" fill="#ffffff" stroke="#231138" stroke-width="6"/>
            <circle cx="70" cy="45" r="36" fill="#fef08a" stroke="#231138" stroke-width="3"/>
            <line x1="70" y1="45" x2="70" y2="22" stroke="#231138" stroke-width="5" stroke-linecap="round"/>
            <line x1="70" y1="45" x2="90" y2="45" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

            <!-- Prateleira 1 -->
            <rect x="0" y="160" width="340" height="20" rx="6" fill="#b45309" stroke="#231138" stroke-width="5"/>
            <!-- Potes coloridos -->
            <rect x="25" y="95" width="56" height="65" rx="12" fill="#c084fc" stroke="#231138" stroke-width="4"/>
            <rect x="33" y="83" width="40" height="14" rx="5" fill="#ef4444" stroke="#231138" stroke-width="4"/>
            <rect x="100" y="105" width="52" height="55" rx="10" fill="#4ade80" stroke="#231138" stroke-width="4"/>
            <rect x="170" y="85" width="64" height="75" rx="14" fill="#fbbf24" stroke="#231138" stroke-width="4"/>
            <text x="186" y="130" font-family="Fredoka" font-size="18" font-weight="700" fill="#231138">BIS</text>
            <!-- Planta Jiboia pendurada -->
            <polygon points="260,160 270,115 315,115 325,160" fill="#e11d48" stroke="#231138" stroke-width="4"/>
            <circle cx="280" cy="110" r="15" fill="#22c55e" stroke="#231138" stroke-width="4"/>
            <circle cx="305" cy="108" r="16" fill="#16a34a" stroke="#231138" stroke-width="4"/>
            <circle cx="320" cy="145" r="12" fill="#22c55e" stroke="#231138" stroke-width="4"/>
            <circle cx="315" cy="175" r="11" fill="#16a34a" stroke="#231138" stroke-width="4"/>
            <circle cx="322" cy="202" r="10" fill="#22c55e" stroke="#231138" stroke-width="4"/>

            <!-- Balcão com Fogão e Bule apitando -->
            <rect x="-60" y="340" width="410" height="200" fill="#fb7185" stroke="#231138" stroke-width="6"/>
            <rect x="-70" y="325" width="430" height="24" rx="8" fill="#fef3c7" stroke="#231138" stroke-width="5"/>
            <!-- Forno -->
            <rect x="40" y="380" width="180" height="130" rx="14" fill="#334155" stroke="#231138" stroke-width="5"/>
            <rect x="60" y="405" width="140" height="80" rx="8" fill="#f97316" stroke="#231138" stroke-width="4"/>
            <!-- Panela no fogão -->
            <rect x="75" y="265" width="110" height="60" rx="10" fill="#a855f7" stroke="#231138" stroke-width="5"/>
            <ellipse cx="130" cy="265" rx="58" ry="12" fill="#c084fc" stroke="#231138" stroke-width="5"/>
          </g>

          <!-- Piso Quadriculado -->
          <rect y="620" width="1440" height="280" fill="url(#checkerFloor)" stroke="#231138" stroke-width="6"/>

          <!-- Mesa / Bancada de Refeição em Primeiro Plano onde o Bis Fica! -->
          <g transform="translate(360, 585)">
            <ellipse cx="360" cy="95" rx="340" ry="78" fill="#d97706" stroke="#231138" stroke-width="7"/>
            <ellipse cx="360" cy="82" rx="325" ry="68" fill="#fbbf24" stroke="#231138" stroke-width="5"/>
            <!-- Toalha de mesa xadrez sob o Bis -->
            <ellipse cx="360" cy="80" rx="220" ry="46" fill="#f43f5e" stroke="#231138" stroke-width="5"/>
            <ellipse cx="360" cy="78" rx="190" ry="38" fill="#ffffff" stroke="#231138" stroke-width="4"/>
          </g>
        </svg>
      </section>

      <!-- ================= SALA 1: BANHEIRO MAXIMALISTA ================= -->
      <section class="room-slide" data-room="1">
        <svg class="room-bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <pattern id="bathTiles" width="64" height="64" patternUnits="userSpaceOnUse">
              <rect width="64" height="64" fill="#67e8f9" stroke="#231138" stroke-width="3"/>
              <rect x="6" y="6" width="22" height="22" rx="4" fill="#a5f3fc"/>
              <rect x="36" y="36" width="22" height="22" rx="4" fill="#22d3ee"/>
            </pattern>
            <pattern id="bathFloorHex" width="70" height="50" patternUnits="userSpaceOnUse">
              <rect width="70" height="50" fill="#f472b6" stroke="#231138" stroke-width="3"/>
              <circle cx="35" cy="25" r="14" fill="#fbcfe8" stroke="#231138" stroke-width="3"/>
            </pattern>
          </defs>

          <!-- Parede de azulejos -->
          <rect width="1440" height="620" fill="url(#bathTiles)"/>
          <!-- Faixa decorativa de ondas -->
          <rect y="300" width="1440" height="28" fill="#f43f5e" stroke="#231138" stroke-width="5"/>

          <!-- Espelho Redondo Ornado + Pia com Escovas, Poções e Perfumes (Esquerda) -->
          <g transform="translate(110, 85)">
            <rect x="20" y="0" width="230" height="280" rx="115" fill="#facc15" stroke="#231138" stroke-width="6"/>
            <rect x="38" y="18" width="194" height="244" rx="97" fill="#e0f2fe" stroke="#231138" stroke-width="5"/>
            <line x1="75" y1="80" x2="135" y2="40" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
            <line x1="85" y1="115" x2="165" y2="55" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
            <!-- Bancada da pia com cosméticos -->
            <rect x="-10" y="265" width="290" height="22" rx="8" fill="#ffffff" stroke="#231138" stroke-width="5"/>
            <!-- Copo com escova de dente -->
            <rect x="25" y="220" width="32" height="45" rx="6" fill="#fb7185" stroke="#231138" stroke-width="4"/>
            <line x1="35" y1="220" x2="22" y2="190" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
            <!-- Frasco de perfume de polvo -->
            <circle cx="220" cy="242" r="22" fill="#c084fc" stroke="#231138" stroke-width="4"/>
            <rect x="212" y="208" width="16" height="14" fill="#fde047" stroke="#231138" stroke-width="4"/>
          </g>

          <!-- Chuveiro Dourado Retrô Centralizado Acima do Bis -->
          <g transform="translate(650, 0)">
            <path d="M70 0 L70 95" stroke="#facc15" stroke-width="16" stroke-linecap="round"/>
            <path d="M70 0 L70 95" stroke="#231138" stroke-width="4"/>
            <path d="M10 115 C10 75, 130 75, 130 115 Z" fill="#facc15" stroke="#231138" stroke-width="6"/>
            <rect x="4" y="112" width="132" height="16" rx="8" fill="#fef08a" stroke="#231138" stroke-width="5"/>
          </g>

          <!-- Máquina de Lavar Colorida + Toalhas + Prateleira com Patinhos de Borracha (Direita) -->
          <g transform="translate(1010, 95)">
            <!-- Prateleira -->
            <rect x="0" y="95" width="320" height="18" rx="6" fill="#fef08a" stroke="#231138" stroke-width="5"/>
            <!-- Patinho de Borracha -->
            <circle cx="65" cy="70" r="22" fill="#facc15" stroke="#231138" stroke-width="4"/>
            <circle cx="80" cy="48" r="14" fill="#facc15" stroke="#231138" stroke-width="4"/>
            <polygon points="94,45 108,50 94,55" fill="#f97316" stroke="#231138" stroke-width="3"/>
            <!-- Toalhas empilhadas -->
            <rect x="140" y="65" width="90" height="30" rx="10" fill="#f43f5e" stroke="#231138" stroke-width="4"/>
            <rect x="145" y="40" width="80" height="25" rx="8" fill="#a855f7" stroke="#231138" stroke-width="4"/>
            <rect x="150" y="18" width="70" height="22" rx="8" fill="#4ade80" stroke="#231138" stroke-width="4"/>

            <!-- Máquina de lavar retrô -->
            <rect x="30" y="235" width="250" height="290" rx="26" fill="#fb923c" stroke="#231138" stroke-width="6"/>
            <rect x="30" y="235" width="250" height="55" rx="20" fill="#fed7aa" stroke="#231138" stroke-width="5"/>
            <circle cx="75" cy="262" r="12" fill="#ef4444" stroke="#231138" stroke-width="4"/>
            <circle cx="110" cy="262" r="12" fill="#22c55e" stroke="#231138" stroke-width="4"/>
            <circle cx="155" cy="395" r="78" fill="#e2e8f0" stroke="#231138" stroke-width="6"/>
            <circle cx="155" cy="395" r="56" fill="#38bdf8" stroke="#231138" stroke-width="5"/>
            <path d="M102 395 Q130 370 155 395 T208 395 L208 445 L102 445 Z" fill="#0284c7" opacity="0.65"/>
          </g>

          <!-- Piso do Banheiro -->
          <rect y="620" width="1440" height="280" fill="url(#bathFloorHex)" stroke="#231138" stroke-width="6"/>

          <!-- Tapete Felpudo de Banho + Banheira Rasinha sob o Bis -->
          <g transform="translate(380, 590)">
            <ellipse cx="340" cy="80" rx="310" ry="66" fill="#fde047" stroke="#231138" stroke-width="6"/>
            <ellipse cx="340" cy="80" rx="275" ry="52" fill="#ffffff" stroke="#231138" stroke-width="5"/>
            <ellipse cx="340" cy="80" rx="235" ry="40" fill="#38bdf8" stroke="#231138" stroke-width="4"/>
          </g>
        </svg>
      </section>

      <!-- ================= SALA 2: SALA DE JOGOS / FLIPERAMA MAXIMALISTA ================= -->
      <section class="room-slide" data-room="2">
        <svg class="room-bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <pattern id="arcadeWall" width="90" height="90" patternUnits="userSpaceOnUse">
              <rect width="90" height="90" fill="#3b0764"/>
              <circle cx="25" cy="25" r="6" fill="#f43f5e" opacity="0.5"/>
              <polygon points="65,15 78,38 52,38" fill="#facc15" opacity="0.45"/>
              <rect x="20" y="60" width="16" height="16" transform="rotate(20 28 68)" fill="#22d3ee" opacity="0.45"/>
            </pattern>
          </defs>

          <!-- Parede Geek / Arcade Anos 90 -->
          <rect width="1440" height="620" fill="url(#arcadeWall)"/>

          <!-- Bandeirinhas Coloridas no Teto -->
          <g stroke="#231138" stroke-width="5">
            <polygon points="80,0 140,85 200,0" fill="#facc15"/>
            <polygon points="200,0 260,85 320,0" fill="#f43f5e"/>
            <polygon points="320,0 380,85 440,0" fill="#22d3ee"/>
            <polygon points="1000,0 1060,85 1120,0" fill="#4ade80"/>
            <polygon points="1120,0 1180,85 1240,0" fill="#a855f7"/>
            <polygon points="1240,0 1300,85 1360,0" fill="#fb923c"/>
          </g>

          <!-- Máquina de Fliperama Arcade (Esquerda) -->
          <g transform="translate(105, 140)">
            <polygon points="20,0 220,0 250,120 230,480 0,480 0,120" fill="#e11d48" stroke="#231138" stroke-width="6"/>
            <rect x="25" y="20" width="195" height="50" rx="8" fill="#fde047" stroke="#231138" stroke-width="5"/>
            <text x="58" y="53" font-family="Fredoka" font-size="28" font-weight="700" fill="#231138">OCTO-ARCADE</text>
            <!-- Tela do Arcade -->
            <rect x="40" y="90" width="165" height="135" rx="14" fill="#0f172a" stroke="#231138" stroke-width="5"/>
            <circle cx="122" cy="155" r="32" fill="#a855f7" stroke="#22d3ee" stroke-width="4"/>
            <!-- Joysticks -->
            <line x1="80" y1="260" x2="80" y2="230" stroke="#231138" stroke-width="6"/>
            <circle cx="80" cy="225" r="12" fill="#facc15" stroke="#231138" stroke-width="4"/>
            <circle cx="145" cy="245" r="10" fill="#22c55e" stroke="#231138" stroke-width="4"/>
            <circle cx="175" cy="240" r="10" fill="#38bdf8" stroke="#231138" stroke-width="4"/>
          </g>

          <!-- Pôsteres Pop-Art e Estante de Troféus / Discos de Vinil / Lava Lamp (Direita) -->
          <g transform="translate(990, 120)">
            <!-- Pôsteres -->
            <rect x="-150" y="10" width="115" height="145" rx="10" fill="#facc15" stroke="#231138" stroke-width="5" transform="rotate(-6 -90 80)"/>
            <circle cx="-92" cy="80" r="35" fill="#ec4899" stroke="#231138" stroke-width="4"/>
