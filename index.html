<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="phone-screen" id="phone-screen">

    <!-- ================= CENÁRIOS PROPORÇÃO ÁUREA (430x900 | Horizonte Áureo Y=556, Pontos Áureos X=164 e X=266) ================= -->
    <div class="rooms-carousel" id="rooms-track">

      <!-- 0. COZINHA (Composição Áurea: Janela em X=102,Y=212 | Prateleiras em X=266,Y=212 | Horizonte em Y=556) -->
      <section class="room-scene scene-kitchen">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="kWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff7ed"/>
              <stop offset="61.8%" stop-color="#ffedd5"/>
              <stop offset="100%" stop-color="#fed7aa"/>
            </linearGradient>
            <linearGradient id="kSunlight" x1="0" y1="0" x2="0.8" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="kTable" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff1f2"/>
              <stop offset="12%" stop-color="#ffe4e6"/>
              <stop offset="12.5%" stop-color="#e11d48"/>
              <stop offset="18%" stop-color="#be123c"/>
              <stop offset="18.5%" stop-color="#881337"/>
              <stop offset="100%" stop-color="#4c0519"/>
            </linearGradient>
            <pattern id="kSubtleTile" width="55" height="55" patternUnits="userSpaceOnUse">
              <rect width="55" height="55" fill="#fffaf5"/>
              <rect x="2" y="2" width="51" height="51" rx="8" fill="#ffedd5" opacity="0.65"/>
            </pattern>
          </defs>

          <!-- Parede Superior (61.8% da altura = 556px) -->
          <rect width="430" height="556" fill="url(#kWall)"/>
          <!-- Faixa Áurea de Azulejos (556 - 212 = 344px) -->
          <rect y="344" width="430" height="212" fill="url(#kSubtleTile)" opacity="0.75"/>
          <rect y="342" width="430" height="4" fill="#fdba74" opacity="0.45"/>

          <!-- Ponto Focal Áureo Esquerdo (X=24..164, Y=110..322): Janela Arqueada Ensolarada com Folhagens -->
          <g transform="translate(26, 108)">
            <rect x="0" y="0" width="138" height="212" rx="69" fill="#bae6fd"/>
            <rect x="8" y="8" width="122" height="196" rx="61" fill="#7dd3fc"/>
            <!-- Sol no ponto áureo da janela -->
            <circle cx="76" cy="68" r="28" fill="#fef08a" opacity="0.95"/>
            <circle cx="76" cy="68" r="44" fill="#fef08a" opacity="0.25"/>
            <!-- Nuvens suaves e colinas -->
            <ellipse cx="48" cy="132" rx="42" ry="16" fill="#ffffff" opacity="0.88"/>
            <ellipse cx="96" cy="142" rx="36" ry="14" fill="#ffffff" opacity="0.92"/>
            <path d="M8 172 Q65 150 130 176 L130 204 L8 204 Z" fill="#6ee7b7"/>
            <!-- Plantas pendentes no arco superior -->
            <ellipse cx="32" cy="10" rx="22" ry="11" transform="rotate(-18 32 10)" fill="#10b981"/>
            <ellipse cx="68" cy="6" rx="24" ry="10" transform="rotate(8 68 6)" fill="#059669"/>
            <ellipse cx="104" cy="14" rx="20" ry="10" transform="rotate(25 104 14)" fill="#34d399"/>
            <circle cx="122" cy="36" r="8" fill="#10b981"/>
            <circle cx="126" cy="56" r="6.5" fill="#34d399"/>
          </g>

          <!-- Ponto Focal Áureo Direito (X=236..404): Duas Prateleiras Harmônicas -->
          <g transform="translate(236, 124)">
            <!-- Prateleira 1 (Y=88) -->
            <rect x="0" y="72" width="168" height="10" rx="5" fill="#d97706" opacity="0.75"/>
            <!-- Pote de vidro de biscoitos -->
            <rect x="14" y="22" width="36" height="50" rx="12" fill="#ffffff" opacity="0.75"/>
            <circle cx="26" cy="54" r="7" fill="#d97706"/>
            <circle cx="37" cy="50" r="6.5" fill="#b45309"/>
            <circle cx="31" cy="40" r="7" fill="#f59e0b"/>
            <rect x="19" y="15" width="26" height="8" rx="4" fill="#fb7185"/>
            <!-- Pote de mel/geleia -->
            <rect x="62" y="30" width="30" height="42" rx="10" fill="#c084fc" opacity="0.82"/>
            <rect x="66" y="23" width="22" height="8" rx="4" fill="#fde047"/>
            <!-- Bule delicado -->
            <ellipse cx="128" cy="52" rx="22" ry="18" fill="#fb7185"/>
            <circle cx="128" cy="32" r="5.5" fill="#fda4af"/>

            <!-- Prateleira 2 (Y=180) -->
            <rect x="16" y="164" width="152" height="10" rx="5" fill="#d97706" opacity="0.75"/>
            <!-- Fruteira -->
            <circle cx="52" cy="142" r="12" fill="#f43f5e"/>
            <circle cx="70" cy="139" r="13" fill="#facc15"/>
            <circle cx="85" cy="144" r="11" fill="#a855f7"/>
            <path d="M32 145 C36 168, 100 168, 104 145 Z" fill="#38bdf8"/>
            <!-- Vasinho de ervas -->
            <rect x="122" y="136" width="26" height="28" rx="6" fill="#fb923c"/>
            <circle cx="128" cy="128" r="10" fill="#34d399"/>
            <circle cx="142" cy="126" r="11" fill="#10b981"/>
          </g>

          <!-- Luz solar suave diagonal (Espirais Áureas de Luz) -->
          <polygon points="26,108 164,108 380,556 80,556" fill="url(#kSunlight)"/>

          <!-- Horizonte Áureo (Y=556): Bancada / Mesa onde o Bis repousa (38.2% inferior = 344px) -->
          <path d="M-20 556 Q215 534 450 556 L450 900 L-20 900 Z" fill="url(#kTable)"/>
          <!-- Jogo americano oval centrado no ponto áureo (X=215, Y=582) -->
          <ellipse cx="215" cy="582" rx="145" ry="28" fill="#ffffff" opacity="0.88"/>
          <ellipse cx="215" cy="582" rx="124" ry="21" fill="#fecdd3" opacity="0.6"/>
        </svg>
      </section>

      <!-- 1. BANHEIRO (Composição Áurea: Espelho em X=95, Prateleiras em X=310, Ducha em X=215, Horizonte em Y=556) -->
      <section class="room-scene scene-bathroom">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="bWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ecfeff"/>
              <stop offset="61.8%" stop-color="#cffafe"/>
              <stop offset="100%" stop-color="#a5f3fc"/>
            </linearGradient>
            <linearGradient id="bFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e0f2fe"/>
              <stop offset="18%" stop-color="#7dd3fc"/>
              <stop offset="100%" stop-color="#0369a1"/>
            </linearGradient>
            <pattern id="bSoftGrid" width="55" height="55" patternUnits="userSpaceOnUse">
              <rect x="2" y="2" width="51" height="51" rx="10" fill="#ffffff" opacity="0.38"/>
            </pattern>
          </defs>

          <rect width="430" height="556" fill="url(#bWall)"/>
          <rect y="344" width="430" height="212" fill="url(#bSoftGrid)"/>

          <!-- Bolhas suaves distribuídas na proporção áurea -->
          <circle cx="88" cy="142" r="34" fill="#ffffff" opacity="0.35"/>
          <circle cx="342" cy="118" r="46" fill="#ffffff" opacity="0.28"/>
          <circle cx="328" cy="310" r="24" fill="#f472b6" opacity="0.16"/>

          <!-- Ponto Áureo Esquerdo: Espelho Oval de Spa com Folhagem -->
          <g transform="translate(32, 118)">
            <ellipse cx="68" cy="96" rx="62" ry="86" fill="#fef08a" opacity="0.45"/>
            <ellipse cx="68" cy="96" rx="54" ry="78" fill="#e0f2fe"/>
            <path d="M36 52 L78 26 L94 34 L44 68 Z" fill="#ffffff" opacity="0.65"/>
            <circle cx="16" cy="28" r="15" fill="#34d399"/>
            <circle cx="8" cy="52" r="12" fill="#10b981"/>
            <circle cx="16" cy="74" r="10" fill="#6ee7b7"/>
          </g>

          <!-- Centro Superior (X=215): Ducha de Spa -->
          <rect x="209" y="0" width="12" height="62" fill="#cbd5e1"/>
          <ellipse cx="215" cy="66" rx="44" ry="11" fill="#e2e8f0"/>
          <ellipse cx="215" cy="69" rx="36" ry="6" fill="#94a3b8"/>

          <!-- Ponto Áureo Direito: Prateleira de Spa com Toalhas, Frascos e Patinho -->
          <g transform="translate(248, 134)">
            <rect x="0" y="74" width="154" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
            <rect x="12" y="46" width="48" height="26" rx="13" fill="#f472b6"/>
            <rect x="18" y="25" width="38" height="22" rx="11" fill="#c084fc"/>
            <rect x="78" y="28" width="24" height="46" rx="10" fill="#34d399"/>
            <rect x="108" y="36" width="26" height="38" rx="11" fill="#fbbf24"/>

            <rect x="14" y="162" width="140" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
            <circle cx="118" cy="146" r="16" fill="#fde047"/>
            <circle cx="128" cy="130" r="10.5" fill="#fde047"/>
            <ellipse cx="138" cy="131" rx="5.5" ry="3" fill="#fb923c"/>
            <circle cx="48" cy="146" r="14" fill="#fb7185" opacity="0.8"/>
          </g>

          <!-- Horizonte Áureo (Y=556) -->
          <path d="M-20 556 Q215 534 450 556 L450 900 L-20 900 Z" fill="url(#bFloor)"/>
          <ellipse cx="215" cy="582" rx="148" ry="29" fill="#ffffff" opacity="0.9"/>
          <ellipse cx="215" cy="582" rx="122" ry="21" fill="#bae6fd" opacity="0.65"/>
        </svg>
      </section>

      <!-- 2. SALA DE JOGOS (Composição Áurea) -->
      <section class="room-scene scene-playroom">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="pWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2e1065"/>
              <stop offset="61.8%" stop-color="#4c1d95"/>
              <stop offset="100%" stop-color="#581c87"/>
            </linearGradient>
            <linearGradient id="pFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#9333ea"/>
              <stop offset="22%" stop-color="#6b21a8"/>
              <stop offset="100%" stop-color="#2e1065"/>
            </linearGradient>
          </defs>

          <rect width="430" height="556" fill="url(#pWall)"/>

          <!-- Luzes Bokeh nos pontos áureos -->
          <circle cx="102" cy="164" r="68" fill="#f43f5e" opacity="0.14"/>
          <circle cx="328" cy="212" r="78" fill="#38bdf8" opacity="0.14"/>

          <!-- Ponto Áureo Esquerdo: Arcade Compacto -->
          <g transform="translate(28, 178)">
            <rect x="0" y="0" width="118" height="260" rx="22" fill="#4f46e5" opacity="0.9"/>
            <rect x="12" y="14" width="94" height="26" rx="10" fill="#fde047"/>
            <rect x="16" y="52" width="86" height="74" rx="12" fill="#0f172a"/>
            <circle cx="59" cy="89" r="20" fill="#a855f7" opacity="0.9"/>
            <circle cx="42" cy="148" r="7" fill="#f43f5e"/>
            <circle cx="68" cy="152" r="6" fill="#34d399"/>
            <circle cx="86" cy="146" r="6" fill="#38bdf8"/>
          </g>

          <!-- Ponto Áureo Direito: Prateleira com Lava Lamp, Vinil e Livros -->
          <g transform="translate(248, 152)">
            <rect x="0" y="82" width="154" height="10" rx="5" fill="#c084fc" opacity="0.5"/>
            <path d="M24 82 L34 22 L52 22 L62 82 Z" fill="#fb7185"/>
            <circle cx="43" cy="58" r="9" fill="#fde047"/>
            <circle cx="112" cy="50" r="28" fill="#1e1b4b"/>
            <circle cx="112" cy="50" r="10" fill="#38bdf8"/>

            <rect x="14" y="182" width="140" height="10" rx="5" fill="#c084fc" opacity="0.5"/>
            <path d="M32 132 L64 132 L56 174 L40 174 Z" fill="#facc15"/>
            <rect x="84" y="128" width="15" height="54" rx="4" fill="#34d399"/>
            <rect x="102" y="120" width="16" height="62" rx="4" fill="#38bdf8"/>
            <rect x="120" y="132" width="15" height="50" rx="4" fill="#f43f5e"/>
          </g>

          <!-- Horizonte Áureo (Y=556) -->
          <path d="M-20 556 Q215 534 450 556 L450 900 L-20 900 Z" fill="url(#pFloor)"/>
          <ellipse cx="215" cy="582" rx="148" ry="29" fill="#f472b6" opacity="0.4"/>
          <ellipse cx="215" cy="582" rx="120" ry="21" fill="#fde047" opacity="0.65"/>
        </svg>
      </section>

      <!-- 3. QUARTO (Composição Áurea) -->
      <section class="room-scene scene-bedroom">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="nWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="61.8%" stop-color="#1e1b4b"/>
              <stop offset="100%" stop-color="#2e1065"/>
            </linearGradient>
            <linearGradient id="nFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#4c1d95"/>
              <stop offset="25%" stop-color="#2e1065"/>
              <stop offset="100%" stop-color="#090514"/>
            </linearGradient>
          </defs>

          <rect width="430" height="556" fill="url(#nWall)"/>

          <!-- Nebulosa suave nos pontos áureos -->
          <circle cx="315" cy="180" r="95" fill="#8b5cf6" opacity="0.12"/>
          <circle cx="102" cy="212" r="80" fill="#38bdf8" opacity="0.1"/>

          <!-- Ponto Áureo Esquerdo: Janela Noturna com Lua Crescente -->
          <g transform="translate(32, 118)">
            <rect x="0" y="0" width="136" height="206" rx="68" fill="#060913"/>
            <circle cx="68" cy="76" r="38" fill="#fef08a" opacity="0.18"/>
            <circle cx="65" cy="76" r="25" fill="#fef08a"/>
            <circle cx="76" cy="68" r="22" fill="#060913"/>
            <circle cx="38" cy="134" r="2" fill="#ffffff"/>
            <circle cx="102" cy="122" r="2.5" fill="#bae6fd"/>
            <path d="M0 172 Q68 150 136 176 L136 206 L0 206 Z" fill="#1e1b4b"/>
          </g>

          <!-- Centro Superior (X=215): Luminária Pendente -->
          <g id="room-lamp" class="clickable-lamp" transform="translate(215, 0)">
            <rect x="-1.5" y="0" width="3" height="62" fill="#94a3b8" opacity="0.55"/>
            <circle cx="0" cy="80" r="48" fill="#fef08a" opacity="0.2" id="lamp-aura"/>
            <path d="M-28 78 C-28 50, 28 50, 28 78 Z" fill="#fb7185"/>
            <circle cx="0" cy="80" r="10" fill="#fef08a"/>
          </g>

          <!-- Ponto Áureo Direito: Prateleira com Pelúcia e Globo Luminoso -->
          <g transform="translate(248, 178)">
            <rect x="0" y="74" width="150" height="10" rx="5" fill="#a855f7" opacity="0.4"/>
            <ellipse cx="54" cy="58" rx="30" ry="17" fill="#f472b6"/>
            <polygon points="32,48 38,32 48,46" fill="#f472b6"/>
            <polygon points="60,46 70,32 76,48" fill="#f472b6"/>
            <circle cx="118" cy="48" r="20" fill="#38bdf8" opacity="0.8"/>
            <circle cx="118" cy="48" r="28" fill="#38bdf8" opacity="0.2"/>
          </g>

          <!-- Horizonte Áureo (Y=556) -->
          <path d="M-20 556 Q215 534 450 556 L450 900 L-20 900 Z" fill="url(#nFloor)"/>
          <ellipse cx="215" cy="582" rx="152" ry="32" fill="#6366f1" opacity="0.72"/>
          <ellipse cx="215" cy="580" rx="126" ry="23" fill="#c084fc" opacity="0.78"/>
        </svg>
      </section>

      <!-- 4. CLOSET (Composição Áurea) -->
      <section class="room-scene scene-closet">
        <svg class="scene-art" viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="cWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fdf2f8"/>
              <stop offset="61.8%" stop-color="#fce7f3"/>
              <stop offset="100%" stop-color="#f5d0fe"/>
            </linearGradient>
            <linearGradient id="cFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c026d3"/>
              <stop offset="25%" stop-color="#86198f"/>
              <stop offset="100%" stop-color="#4a044e"/>
            </linearGradient>
            <pattern id="cStripes" width="54" height="54" patternUnits="userSpaceOnUse">
              <rect width="27" height="54" fill="#fbcfe8" opacity="0.32"/>
            </pattern>
          </defs>

          <rect width="430" height="556" fill="url(#cWall)"/>
          <rect width="430" height="556" fill="url(#cStripes)"/>

          <!-- Cortinas enquadrando a razão áurea lateral (X=0..102 e X=328..430) -->
          <path d="M0 0 L102 0 C85 200, 58 380, 22 556 L0 556 Z" fill="#ec4899" opacity="0.7"/>
          <path d="M430 0 L328 0 C345 200, 372 380, 408 556 L430 556 Z" fill="#ec4899" opacity="0.7"/>

          <!-- Espelho de Camarim Centralizado no Ponto Áureo Superior -->
          <g transform="translate(116, 108)">
            <rect x="0" y="0" width="198" height="278" rx="99" fill="#facc15" opacity="0.6"/>
            <rect x="14" y="14" width="170" height="250" rx="85" fill="#e0f2fe"/>
            <circle cx="20" cy="76" r="7" fill="#ffffff"/>
            <circle cx="12" cy="139" r="7" fill="#ffffff"/>
            <circle cx="20" cy="202" r="7" fill="#ffffff"/>
            <circle cx="178" cy="76" r="7" fill="#ffffff"/>
            <circle cx="186" cy="139" r="7" fill="#ffffff"/>
            <circle cx="178" cy="202" r="7" fill="#ffffff"/>
          </g>

          <!-- Horizonte Áureo (Y=556) -->
          <path d="M-20 556 Q215 534 450 556 L450 900 L-20 900 Z" fill="url(#cFloor)"/>
          <ellipse cx="215" cy="582" rx="150" ry="30" fill="#fde047" opacity="0.75"/>
          <ellipse cx="215" cy="580" rx="126" ry="22" fill="#ffffff" opacity="0.88"/>
        </svg>
      </section>
    </div>

    <div class="night-overlay" id="night-overlay"></div>

    <!-- ================= HUD SUPERIOR HARMÔNICO ================= -->
    <header class="pou-top-bar">
      <div class="top-stats-row">
        <div class="floating-coins" title="Moedas">
          <span class="coin-orb">🪙</span>
          <span id="hud-coins">120</span>
        </div>

        <div class="floating-meters">
          <div class="meter-orb" title="Fome">
            <span class="orb-emoji">🍙</span>
            <div class="orb-bar"><div class="orb-fill" id="hud-hunger"></div></div>
          </div>
          <div class="meter-orb" title="Limpeza">
            <span class="orb-emoji">🫧</span>
            <div class="orb-bar"><div class="orb-fill" id="hud-clean"></div></div>
          </div>
          <div class="meter-orb" title="Diversão">
            <span class="orb-emoji">🎾</span>
            <div class="orb-bar"><div class="orb-fill" id="hud-fun"></div></div>
          </div>
          <div class="meter-orb" title="Energia">
            <span class="orb-emoji">⚡</span>
            <div class="orb-bar"><div class="orb-fill" id="hud-energy"></div></div>
          </div>
        </div>
      </div>

      <div class="room-nav-row">
        <button class="clean-arrow" id="btn-prev-room" aria-label="Anterior">‹</button>
        <span class="clean-room-title" id="room-title">Cozinha</span>
        <button class="clean-arrow" id="btn-next-room" aria-label="Próximo">›</button>
      </div>
    </header>

    <!-- ================= PALCO CENTRAL DO BIS (POSICIONADO NO HORIZONTE ÁUREO) ================= -->
    <main class="bis-stage" id="bis-stage">
      <div class="stage-fx-layer" id="stage-fx-layer"></div>
      <div class="foam-container" id="foam-container"></div>
      <div class="bouncing-ball" id="bouncing-ball">⚽</div>

      <div class="bis-wrapper" id="bis-wrapper">
        <svg class="bis-svg" id="bis-svg" viewBox="0 0 380 340" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bisBodyGrad" cx="36%" cy="28%" r="68%">
              <stop offset="0%" id="grad-highlight" stop-color="#9d74ff" />
              <stop offset="48%" id="grad-main" stop-color="#5e24ff" />
              <stop offset="100%" id="grad-shadow" stop-color="#310a9e" />
            </radialGradient>

            <radialGradient id="bisSegmentGrad" cx="35%" cy="28%" r="72%">
              <stop offset="0%" id="seg-highlight" stop-color="#8b5cf6" />
              <stop offset="55%" id="seg-main" stop-color="#4f16e8" />
              <stop offset="100%" id="seg-shadow" stop-color="#26067d" />
            </radialGradient>

            <radialGradient id="bisBackGrad" cx="40%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#4c1d95" />
              <stop offset="100%" stop-color="#1e064a" />
            </radialGradient>

            <filter id="bisSoftDrop" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#150438" flood-opacity="0.32" />
            </filter>
          </defs>

          <ellipse id="bis-shadow" cx="190" cy="276" rx="116" ry="20" fill="rgba(20, 5, 52, 0.25)" />

          <g id="bis-physics-root" filter="url(#bisSoftDrop)">
            <!-- Tentáculos Traseiros -->
            <g fill="url(#bisBackGrad)">
              <g class="tentacle-proc" data-index="0">
                <rect x="78" y="182" width="32" height="24" rx="12" transform="rotate(-26 94 194)" />
                <rect x="52" y="195" width="30" height="23" rx="11.5" transform="rotate(-20 67 206)" />
                <circle cx="38" cy="211" r="13.5" />
              </g>
              <g class="tentacle-proc" data-index="7">
                <rect x="270" y="182" width="32" height="24" rx="12" transform="rotate(26 286 194)" />
                <rect x="298" y="195" width="30" height="23" rx="11.5" transform="rotate(20 313 206)" />
                <circle cx="342" cy="211" r="13.5" />
              </g>
            </g>

            <!-- 6 Tentáculos Articulados Frontais -->
